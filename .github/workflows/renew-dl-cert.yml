name: Renew dl.msime.app certificate

# dl.msime.app 是下载镜像（阿里云 OSS 香港 bucket metasequoiaime 的自定义域名，见 README「国内镜像」）。证书是 Let's Encrypt 的，90 天有效，这个账号的阿里云免费证书额度已经用完（everyapi 的 dl.everyapi.ai 同样如此），所以每天读一次线上证书，剩余天数低于阈值时用 DNS-01 重新签发并挂到 OSS 的自定义域名上。做法照搬 everyapi 仓库的 cli-cert-renew.yml，它踩过的坑这里一并避开：以线上证书为准决定续不续，不信任 CLI 的退出码，部署后回读线上证书核对序列号。
#
# 凭据都限定在这一个任务里：
# - Cloudflare token 是 environment dl-cert 的 secret，environment 只允许 main 部署，只有 renew 这个 job 拿得到。它和集群里 cert-manager 用的是同一个 token。
# - 阿里云用 GitHub OIDC 扮演 RAM 角色 msime-web-dl-cert，只能改 metasequoiaime 的 CNAME 绑定和上传证书，和上传镜像用的角色分开。job 带了 environment，OIDC token 的 sub 是 `…:environment:dl-cert`，信任策略按这个写。
#
# 证书私钥只在这台 GitHub 托管的一次性 runner 上落盘，作为文件交给 ossutil，不进命令行参数。

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      force_renew:
        description: Issue and deploy even when the live certificate is not near expiry
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renew-dl-cert
  cancel-in-progress: false

env:
  DL_DOMAIN: dl.msime.app
  # 剩 30 天开始续：每天一轮，留出三十次重试的机会。
  RENEW_BELOW_DAYS: '30'

jobs:
  # 每天的检查不带 environment：带了的话每轮都会在仓库里留一条 deployment 记录，而绝大多数轮次什么都不做。
  check:
    name: Read the live certificate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renew: ${{ steps.live.outputs.renew }}
      serial: ${{ steps.live.outputs.serial }}
    steps:
      - name: Read the live certificate
        id: live
        env:
          FORCE_RENEW: ${{ inputs.force_renew }}
        run: |
          set -euo pipefail
          pem=$(echo | openssl s_client -servername "$DL_DOMAIN" -connect "$DL_DOMAIN:443" 2>/dev/null | openssl x509 2>/dev/null || true)
          if [ -z "$pem" ]; then
            # 握手失败也要续：这正是证书已经过期或者被摘掉时的样子。
            echo "::warning title=cert unreadable::could not complete a TLS handshake with $DL_DOMAIN; renewing"
            { echo "renew=true"; echo "serial="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          not_after=$(printf '%s\n' "$pem" | openssl x509 -noout -enddate | cut -d= -f2)
          serial=$(printf '%s\n' "$pem" | openssl x509 -noout -serial | cut -d= -f2)
          days=$(( ( $(date -u -d "$not_after" +%s) - $(date -u +%s) ) / 86400 ))
          printf 'live serial %s, expires %s, %s days left\n' "$serial" "$not_after" "$days"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          if [ "$days" -lt "$RENEW_BELOW_DAYS" ] || [ "${FORCE_RENEW:-false}" = true ]; then
            echo "renew=true" >> "$GITHUB_OUTPUT"
          else
            echo "renew=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=cert healthy::$DL_DOMAIN has $days days left; renewal starts below $RENEW_BELOW_DAYS"
          fi

  renew:
    name: Issue and bind a new certificate
    needs: check
    if: needs.check.outputs.renew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dl-cert
    permissions:
      contents: read
      id-token: write
    env:
      ACME_VERSION: '3.1.3'
      ACME_COMMIT: 76d1377fc12a0f9408d8917bebb8532e3f24d3ab
      # 官方只在 gosspublic.alicdn.com 发布 ossutil 2.x，没有附校验值；这个哈希是 2026-10-08 下载时算的，同一来源的 macOS 包与 aliyun CLI 自己下载的 ossutil 逐字节一致。
      OSSUTIL_VERSION: '2.4.0'
      OSSUTIL_SHA256: 85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c
    steps:
      - name: Issue the certificate (Let's Encrypt, DNS-01 on Cloudflare)
        env:
          CF_Token: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_Token"
          git clone --quiet --depth 1 --branch "$ACME_VERSION" https://github.com/acmesh-official/acme.sh "$RUNNER_TEMP/acme.sh"
          test "$(git -C "$RUNNER_TEMP/acme.sh" rev-parse HEAD)" = "$ACME_COMMIT"
          # acme.sh 只能在自己的目录里运行；--home 把账户和缓存都放在 RUNNER_TEMP 下，job 结束就没了。
          cd "$RUNNER_TEMP/acme.sh"
          ./acme.sh --home "$RUNNER_TEMP/acmehome" --register-account -m metasequoiaime@gmail.com --server letsencrypt
          ./acme.sh --home "$RUNNER_TEMP/acmehome" --issue --dns dns_cf -d "$DL_DOMAIN" \
            --server letsencrypt --keylength ec-256 \
            --fullchain-file "$RUNNER_TEMP/fullchain.pem" --key-file "$RUNNER_TEMP/cert.key"

      - name: Assume the certificate role
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIYUN_CERT_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: msime-web-renew-dl-cert

      - name: Install ossutil (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ossutil.zip" "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          echo "${OSSUTIL_SHA256}  $RUNNER_TEMP/ossutil.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Bind the certificate to the OSS custom domain
        env:
          BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          REGION: ${{ vars.ALIYUN_OSS_REGION }}
        run: |
          set -euo pipefail
          # ossutil 从这三个环境变量读临时凭据，不经过命令行参数。
          export OSS_ACCESS_KEY_ID="$ALIBABA_CLOUD_ACCESS_KEY_ID" OSS_ACCESS_KEY_SECRET="$ALIBABA_CLOUD_ACCESS_KEY_SECRET" OSS_SESSION_TOKEN="$ALIBABA_CLOUD_SECURITY_TOKEN"
          umask 077
          # 必须是 XML：ossutil 接受 JSON 形式的 --cname-configuration，但会把 CertificateConfiguration 丢掉，调用成功却不挂证书（2026-10-08 实测）。
          python3 - "$RUNNER_TEMP" "$DL_DOMAIN" <<'EOF'
          import pathlib, sys
          from xml.sax.saxutils import escape
          temp, domain = pathlib.Path(sys.argv[1]), sys.argv[2]
          (temp / 'cname.xml').write_text(
              '<?xml version="1.0" encoding="UTF-8"?><BucketCnameConfiguration><Cname>'
              f'<Domain>{escape(domain)}</Domain><CertificateConfiguration>'
              f'<Certificate>{escape((temp / "fullchain.pem").read_text())}</Certificate>'
              f'<PrivateKey>{escape((temp / "cert.key").read_text())}</PrivateKey>'
              '<Force>true</Force></CertificateConfiguration></Cname></BucketCnameConfiguration>')
          EOF
          ossutil api put-cname --bucket "$BUCKET" --region "${REGION#oss-}" --cname-configuration "file://$RUNNER_TEMP/cname.xml"
          rm -f "$RUNNER_TEMP/cname.xml"
          # 以 OSS 记录的绑定为准再核对一次：证书指纹必须是这一轮签的那张。
          want=$(openssl x509 -in "$RUNNER_TEMP/fullchain.pem" -noout -fingerprint -sha1 | cut -d= -f2)
          bound=$(ossutil api list-cname --bucket "$BUCKET" --region "${REGION#oss-}" | python3 -c '
          import sys, xml.etree.ElementTree as ET
          for cname in ET.fromstring(sys.stdin.read()).iter("Cname"):
              if cname.findtext("Domain") == sys.argv[1]:
                  print(cname.findtext("Certificate/Fingerprint") or "")' "$DL_DOMAIN")
          if [ "$bound" != "$want" ]; then
            echo "::error title=cert not bound::OSS reports fingerprint '${bound}' for $DL_DOMAIN, expected $want"
            exit 1
          fi

      - name: Verify the live certificate was replaced
        run: |
          set -euo pipefail
          want=$(openssl x509 -in "$RUNNER_TEMP/fullchain.pem" -noout -serial | cut -d= -f2)
          # OSS 的接入点不是同时换上新证书的，连续五次握手都拿到新证书才算部署完成。
          for attempt in $(seq 1 30); do
            ok=0
            for _ in 1 2 3 4 5; do
              live=$(echo | openssl s_client -servername "$DL_DOMAIN" -connect "$DL_DOMAIN:443" 2>/dev/null | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2 || true)
              [ "$live" = "$want" ] && ok=$((ok + 1))
            done
            if [ "$ok" -eq 5 ]; then
              echo "::notice title=cert deployed::$DL_DOMAIN serves the certificate issued by this run (serial $want)"
              exit 0
            fi
            echo "attempt $attempt/30: $ok of 5 handshakes served $want"
            sleep 20
          done
          echo "::error title=cert not deployed::$DL_DOMAIN still does not consistently serve serial $want after ten minutes"
          exit 1
