name: Report automation failure

# 定时任务坏了没人知道。sync-community 从 2026-09-12 起每天挂一次，连挂九天，期间首页预渲染的社区数字一直停在 09-11；
# 没有任何一轮失败传出去。GitHub 默认只给工作流文件最后一次提交的人发一封邮件，那封邮件没人看，而九天里也没有第二个信号。
#
# 所以把失败变成仓库里一个 open issue：看板上是一个看得见的状态，不是一封可以被忽略的邮件。恢复的那一轮自动关掉它，
# 于是「有没有坏」不需要任何人记得去查。已经开着 issue 的时候后续失败不再重复开，否则半小时一轮的任务一天能刷出四十八个。
#
# 只看 schedule 那一轮：workflow_dispatch 和 PR 上跑失败了，按下去的人当场就看见了。

on:
  workflow_run:
    workflows:
      - Sync community snapshot
      - Sync downloads
      - CodeQL
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: report-automation-failure-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    name: Track the scheduled run in an issue
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the failure issue, or close it on recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          case "$CONCLUSION" in
            success|failure|timed_out) ;;
            # A cancelled or skipped run says nothing about the workflow's health.
            *) echo "Ignoring conclusion: $CONCLUSION"; exit 0 ;;
          esac

          title="Scheduled workflow failing: $WORKFLOW"
          # Matched on the exact title rather than through issue search, which is indexed asynchronously
          # and would open a second issue for a workflow already reported minutes earlier.
          number=$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')

          if [ "$CONCLUSION" = success ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GH_REPO" \
                --body "Recovered: [run #${RUN_NUMBER}](${RUN_URL}) succeeded."
              gh issue close "$number" --repo "$GH_REPO"
            fi
            exit 0
          fi

          if [ -n "$number" ]; then
            echo "Already tracked in #$number; leaving it open."
            exit 0
          fi

          gh issue create --repo "$GH_REPO" --title "$title" --body "$(printf '%s\n' \
            "\`$WORKFLOW\` failed on its scheduled run: [run #${RUN_NUMBER}](${RUN_URL})." \
            "" \
            "This issue closes itself when a scheduled run of the same workflow succeeds, so an open issue here means the workflow is failing right now. Later failures do not reopen or duplicate it." \
            "" \
            "Whatever this workflow keeps up to date has stopped being updated. Check what the site serves from it before assuming the only damage is a red run.")"
