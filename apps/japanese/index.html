<!doctype html>
<html lang="ja" class="preload">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/msime.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="水杉日语は、水杉输入法（MSIME）の日本語入力だけを収めたオープンソースの単体版です。" />
  <title>水杉日语（MSIME Japanese）</title>
  <link rel="canonical" href="https://japanese.msime.app/" />
  <link rel="apple-touch-icon" href="/msime-logo.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F7F4EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="水杉日语" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:url" content="https://japanese.msime.app/" />
  <meta property="og:title" content="水杉日语（MSIME Japanese）" />
  <meta property="og:description" content="水杉日语は、水杉输入法（MSIME）の日本語入力だけを収めたオープンソースの単体版です。" />
  <meta property="og:image" content="https://japanese.msime.app/msime-logo.png" />
  <meta property="og:image:alt" content="水杉日语" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="水杉日语（MSIME Japanese）" />
  <meta name="twitter:description" content="水杉日语は、水杉输入法（MSIME）の日本語入力だけを収めたオープンソースの単体版です。" />
  <meta name="twitter:image" content="https://japanese.msime.app/msime-logo.png" />

  <script>
    (() => {
      const root = document.documentElement;
      let theme = "system";
      let season = "auto";
      try {
        const storedTheme = localStorage.getItem("msime-theme");
        if (["light", "dark", "system"].includes(storedTheme)) theme = storedTheme;
        const storedSeason = localStorage.getItem("msime-season");
        if (["auto", "spring", "summer", "autumn", "winter"].includes(storedSeason)) season = storedSeason;
      } catch {}
      const month = new Date().getMonth() + 1;
      root.dataset.theme = theme;
      root.dataset.season = season !== "auto" ? season : month >= 3 && month <= 5 ? "spring" : month >= 6 && month <= 8 ? "summer" : month >= 9 && month <= 11 ? "autumn" : "winter";
    })();
  </script>

  <style>
    html { background-color: #F7F4EC; color-scheme: light; }
    html[data-theme="dark"] { background-color: #0F1420; color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] { background-color: #0F1420; color-scheme: dark; }
    }

    body {
      background-color: inherit;
    }

    /* The page is rendered by React; hide the mount point until the styles are in place. Only #root, so the note below stays visible with scripts disabled. */
    html.preload #root {
      visibility: hidden;
    }

    .noscript-note {
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #5D6477;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <noscript>
    <p class="noscript-note">このサイトの表示には JavaScript が必要です。ブラウザーで有効にするか、<a href="https://github.com/metasequoiaime/msime/releases">GitHub のリリース一覧</a>から直接ダウンロードしてください。</p>
  </noscript>

  <script type="module" src="/src/app.tsx"></script>
</body>

</html>
