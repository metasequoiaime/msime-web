  <script>
    (() => {
      const root = document.documentElement;
      let theme = "system";
      try {
        const stored = localStorage.getItem("msime-theme");
        if (["light", "dark", "system"].includes(stored)) theme = stored;
      } catch {}
      const month = new Date().getMonth() + 1;
      root.dataset.theme = theme;
      root.dataset.season = month >= 3 && month <= 5 ? "spring" : month >= 6 && month <= 8 ? "summer" : month >= 9 && month <= 11 ? "autumn" : "winter";
    })();
  </script>

  <style>
    html { background-color: #FAF5EC; color-scheme: light; }
    html[data-theme="dark"] { background-color: #160C0E; color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] { background-color: #160C0E; color-scheme: dark; }
    }

    body {
      background-color: inherit;
    }

    /* Hide the mount point until styles arrive in dev; only #root, so the noscript note stays visible. */
    html.preload #root {
      visibility: hidden;
    }

    .noscript-note {
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #715A5C;
      font-family: -apple-system, "Segoe UI", "Noto Serif Tibetan", "Noto Sans Tibetan", "Kailasa", "Microsoft Himalaya", sans-serif;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <noscript>
    <p class="noscript-note">ཤོག་ངོས་འདི་ལྟ་བར་ JavaScript དགོས། 本页需要 JavaScript。<a href="https://github.com/metasequoiaime/msime/releases">GitHub</a></p>
  </noscript>

  <script type="module" src="/src/app.tsx"></script>
</body>

</html>
